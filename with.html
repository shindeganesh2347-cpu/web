
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIARA MILLS - Design Master</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fff1f2;color:#451a1a}
header{background:linear-gradient(120deg,#991b1b,#ef4444);color:white;text-align:center;padding:25px;font-size:30px;font-weight:bold;letter-spacing:2px}
nav{display:flex;justify-content:center;gap:25px;flex-wrap:wrap;background:white;padding:16px;box-shadow:0 3px 10px #0001}
nav a{color:#991b1b;text-decoration:none;font-weight:bold}
main{max-width:700px;width:92%;margin:30px auto;background:white;padding:28px;border-radius:14px;box-shadow:0 5px 20px #0001}
h2{color:#991b1b}
label{display:block;margin:16px 0 7px;font-weight:bold;color:#7f1d1d}
input{width:100%;padding:12px;border:1px solid #fca5a5;border-radius:8px;font-size:15px;background:#fffafa}
button{padding:12px 18px;border:0;border-radius:7px;color:white;background:#b91c1c;cursor:pointer;font-weight:bold;margin:18px 8px 0 0}
button:hover{background:#7f1d1d}
#message{color:#991b1b;overflow-wrap:anywhere}
@media(max-width:600px){header{font-size:24px}main{padding:20px}nav{gap:15px}button{width:100%}}
</style>
</head>
<body>
<header>KIARA MILLS</header>
<nav>
<a href="home.html">Dashboard</a>
<a href="with.html">Design Master</a>
<a href="stock.html">Stock</a>
</nav>

<main>
<h2>Add New Design</h2>
<form id="designForm">
<label for="design">Design Number</label>
<input id="design" required maxlength="100" placeholder="Enter Design Number">

<label for="gala">Gala Number</label>
<input id="gala" maxlength="100" placeholder="Enter Gala Number">

<label for="colour">Colour</label>
<input id="colour" maxlength="100" placeholder="Enter Colour">

<label for="total">Total PCS</label>
<input id="total" type="number" min="0" step="1" required value="0">

<label for="damage">Damage PCS</label>
<input id="damage" type="number" min="0" step="1" required value="0">

<p id="message" role="status"></p>

<button type="submit" id="saveButton">Save Design</button>
<button type="button" onclick="location.href='stock.html'">View Stock</button>
</form>
</main>

<script>
const API = "/api/designs";

async function request(url, options = {}) {
    const response = await fetch(url, {
        ...options,
        headers: {
            "Content-Type": "application/json",
            ...(options.headers || {})
        }
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(result.message || result.error || "Request failed");
    return result;
}

document.getElementById("designForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const design_no = document.getElementById("design").value.trim();
    const gala_no = document.getElementById("gala").value.trim();
    const colour = document.getElementById("colour").value.trim();
    const total_pcs = Number(document.getElementById("total").value);
    const damage_pcs = Number(document.getElementById("damage").value);
    const message = document.getElementById("message");
    const button = document.getElementById("saveButton");

    if (!design_no) {
        message.textContent = "Please enter a design number.";
        return;
    }

    if (!Number.isInteger(total_pcs) || total_pcs < 0 ||
        !Number.isInteger(damage_pcs) || damage_pcs < 0 ||
        damage_pcs > total_pcs) {
        message.textContent = "Please enter valid PCS values. Damage PCS cannot exceed Total PCS.";
        return;
    }

    button.disabled = true;
    button.textContent = "Saving...";
    message.textContent = "";

    try {
        await request(API, {
            method: "POST",
            body: JSON.stringify({
                design_no, gala_no, colour, total_pcs, damage_pcs
            })
        });

        message.textContent = "Design saved successfully!";
        this.reset();
        document.getElementById("total").value = 0;
        document.getElementById("damage").value = 0;
    } catch (error) {
        message.textContent = "Save failed: " + error.message;
    } finally {
        button.disabled = false;
        button.textContent = "Save Design";
    }
});
</script>
</body>
</html>
