
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIARA MILLS - Stock</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fff1f2;color:#451a1a}
header{background:linear-gradient(120deg,#991b1b,#ef4444);color:white;text-align:center;padding:25px;font-size:30px;font-weight:bold;letter-spacing:2px}
nav{display:flex;justify-content:center;gap:25px;flex-wrap:wrap;background:white;padding:16px;box-shadow:0 3px 10px #0001}
nav a{color:#991b1b;text-decoration:none;font-weight:bold}
nav a:hover{color:#ef4444}
main{max-width:1150px;width:94%;margin:28px auto}
h2{color:#991b1b}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin:20px 0}
.card{background:white;border-radius:12px;padding:20px;box-shadow:0 4px 15px #0001;border:1px solid #fecaca}
.card span{display:block;color:#7f1d1d;margin-bottom:10px}
.card strong{font-size:26px;color:#dc2626}
input{width:100%;padding:12px;border:1px solid #fca5a5;border-radius:8px;margin:12px 0;background:white;font-size:15px}
.table-wrap{overflow-x:auto;background:white;border-radius:10px;box-shadow:0 4px 15px #0001}
table{width:100%;border-collapse:collapse;min-width:800px}
th{background:#991b1b;color:white}
th,td{padding:12px;text-align:left;border-bottom:1px solid #fee2e2}
button{border:0;border-radius:6px;padding:9px 12px;color:white;cursor:pointer;margin:2px}
.edit{background:#b45309}.delete{background:#dc2626}.add{background:#991b1b;padding:12px 16px;margin-top:18px}
#message{color:#991b1b}
@media(max-width:600px){header{font-size:24px}nav{gap:15px}main{width:96%}}
</style>
</head>
<body>
<header>KIARA MILLS</header>
<nav>
<a href="home.html">Dashboard</a>
<a href="with.html">Design Master</a>
<a href="stock.html">Stock</a>
</nav>

<main>
<h2>Stock Management</h2>

<section class="cards">
<div class="card"><span>Total Designs</span><strong id="totalDesigns">0</strong></div>
<div class="card"><span>Available Stock (PCS)</span><strong id="availableStock">0</strong></div>
<div class="card"><span>Damaged Stock (PCS)</span><strong id="damagedStock">0</strong></div>
</section>

<input id="search" type="search" placeholder="Search design number, gala number or colour...">
<p id="message">Loading stock...</p>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Design No</th><th>Gala No</th><th>Colour</th>
<th>Total PCS</th><th>Damage PCS</th><th>Available PCS</th><th>Actions</th>
</tr>
</thead>
<tbody id="tableData">
<tr><td colspan="7">Loading...</td></tr>
</tbody>
</table>
</div>

<button class="add" onclick="location.href='with.html'">+ Add New Design</button>
<button class="add" onclick="location.href='home.html'">← Dashboard</button>
</main>

<script>
const API = "/api/designs";
let records = [];

async function request(url, options = {}) {
    const response = await fetch(url, {
        ...options,
        headers: {
            "Content-Type": "application/json",
            ...(options.headers || {})
        }
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(result.message || result.error || "Request failed");
    return result;
}

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;",
        '"':"&quot;", "'":"&#39;"
    })[c]);
}

function numberValue(value) {
    const n = Number(value);
    return Number.isFinite(n) && n > 0 ? n : 0;
}

function displayData() {
    const query = document.getElementById("search").value.trim().toLowerCase();
    const filtered = records.filter(item =>
        [item.design_no, item.gala_no, item.colour]
        .some(value => String(value ?? "").toLowerCase().includes(query))
    );

    document.getElementById("tableData").innerHTML = filtered.map(item => {
        const total = numberValue(item.total_pcs);
        const damage = numberValue(item.damage_pcs);
        const available = Math.max(0, total - damage);
        const id = escapeHTML(item.id);

        return `<tr>
            <td>${escapeHTML(item.design_no)}</td>
            <td>${escapeHTML(item.gala_no)}</td>
            <td>${escapeHTML(item.colour)}</td>
            <td>${total}</td>
            <td>${damage}</td>
            <td>${available}</td>
            <td>
                <button class="edit" onclick="editData('${id}')">Edit</button>
                <button class="delete" onclick="deleteData('${id}')">Delete</button>
            </td>
        </tr>`;
    }).join("") || '<tr><td colspan="7">No designs found.</td></tr>';

    document.getElementById("totalDesigns").textContent = records.length;
    document.getElementById("availableStock").textContent =
        records.reduce((sum, item) =>
            sum + Math.max(0, numberValue(item.total_pcs) - numberValue(item.damage_pcs)), 0);
    document.getElementById("damagedStock").textContent =
        records.reduce((sum, item) => sum + numberValue(item.damage_pcs), 0);
    document.getElementById("message").textContent = `${filtered.length} design(s) found.`;
}

async function loadRecords() {
    try {
        const result = await request(API);
        records = Array.isArray(result) ? result : (result.data ?? result.designs ?? []);
        if (!Array.isArray(records)) throw new Error("Invalid designs response");
        displayData();
    } catch (error) {
        document.getElementById("tableData").innerHTML =
            '<tr><td colspan="7">Unable to load stock.</td></tr>';
        document.getElementById("message").textContent = error.message;
    }
}

function editData(id) {
    localStorage.setItem("editId", id);
    location.href = "edit.html";
}

async function deleteData(id) {
    if (!confirm("Do you want to delete this design?")) return;
    try {
        await request(`${API}/${encodeURIComponent(id)}`, { method: "DELETE" });
        await loadRecords();
        alert("Design deleted successfully.");
    } catch (error) {
        alert("Delete failed: " + error.message);
    }
}

document.getElementById("search").addEventListener("input", displayData);
loadRecords();
</script>
</body>
</html>
